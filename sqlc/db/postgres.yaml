version: "2"
sql:
  - engine: "postgresql"
    queries: "./query/users.sql"
    schema: "./schema/init.sql"
    gen:
      go:
        package: "postgresql"
        sql_package: "pgx/v4"
        out: "../sqlc"
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_result_struct_pointers: true