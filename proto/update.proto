syntax = "proto3";
option go_package = "github.com/shishir9159/kapetanios/proto";

message PrerequisitesMinorUpdate {
  string repoURL = 1;
  string repoName = 2;
  string log = 3;
  string err = 4;
}

message UpdateResponse {
  bool proceedNextStep = 1;
  bool retryCurrentStep = 2;
  bool terminateApplication = 3; // TODO: try another healthy VM of the same OS
}

message AvailableVersions {
  repeated string version = 1;
  string err = 2;
}

message UpdateFinalizer {
  bool responseReceived = 1;
  bool retryCurrentStep = 2;
}

service MinorUpdate {
  rpc PrerequisitesCheck(PrerequisitesMinorUpdate) returns (UpdateResponse);
  rpc UpdateVersionSelection(AvailableVersions) returns (UpdateFinalizer);
}