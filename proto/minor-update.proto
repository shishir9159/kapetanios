syntax = "proto3";
option go_package = "github.com/shishir9159/kapetanios/proto";

message PackageInfo {
  repeated string version = 1;
  string distro = 2;
  string distroVersion = 3;
  string distroPrettyName = 4;
  string repoName = 5;
  string repoBaseURL = 6;
  string currentVersion = 7;
  string log = 8;
  string err = 9;
}

message UpdateFinalizer {
  bool responseReceived = 1;
  bool retryCurrentStep = 2;
  bool terminateApplication = 3;
  // TODO: try another healthy VM of the same OS
  //  if error occurs
}

service MinorUpdate {
  rpc PackageInfoUpdate(PackageInfo) returns (UpdateFinalizer);
}