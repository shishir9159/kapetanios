apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kapetanios-frontend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: kapetanios-frontend
spec:
  ingressClassName: nginx
  rules:
    - host: kapetanios-ui.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kapetanios-frontend
                port:
                  number: 80